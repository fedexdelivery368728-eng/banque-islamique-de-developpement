<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi du virement</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f5;color:#19332d;font-family:Arial,sans-serif}
.wrap{max-width:820px;margin:40px auto;padding:20px}
.card{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:28px}
h1,h2{color:#073d34}
h2{font-size:19px;margin:28px 0 16px}
.tag{display:inline-block;padding:6px 10px;border-radius:8px;background:#e8f3ef;color:#075b49;font-size:12px;font-weight:bold}
.muted{color:#64746e}
.bar{height:18px;background:#e6efeb;border-radius:20px;overflow:hidden;margin:18px 0}
.fill{height:100%;width:0;background:#087f68;transition:width .3s}
.percent{font-size:42px;font-weight:700;color:#073d34}
.notice{margin-top:22px;padding:14px;border-radius:10px;background:#f0f7f4}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{padding:14px;background:#f7faf8;border:1px solid #e5eee9;border-radius:10px;min-width:0}
.item .label{display:block;color:#64746e;font-size:13px;margin-bottom:7px}
.item strong{display:block;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:560px){.wrap{margin:12px auto;padding:12px}.card{padding:20px}.details{grid-template-columns:1fr}.percent{font-size:36px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<span class="tag" id="tag">SUIVI DU VIREMENT</span>
<h1 id="heading">Suivi du virement</h1>

<p class="muted">
<span id="referenceLabel">Référence :</span>
<strong id="ref">Chargement…</strong>
</p>

<div class="percent" id="percent">—%</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<strong id="status">Chargement…</strong>
<div class="notice" id="message">Évolution du virement en cours.</div>

<h2 id="detailsTitle">Détails du virement</h2>
<div class="details">
<div class="item"><span class="label" id="senderLabel">Expéditeur</span><strong id="sender">—</strong></div>
<div class="item"><span class="label" id="beneficiaryLabel">Bénéficiaire</span><strong id="beneficiary">—</strong></div>
<div class="item"><span class="label" id="bankLabel">Banque bénéficiaire</span><strong id="bank">—</strong></div>
<div class="item"><span class="label" id="countryLabel">Pays du bénéficiaire</span><strong id="country">—</strong></div>
<div class="item"><span class="label" id="amountLabel">Montant</span><strong id="amount">—</strong></div>
<div class="item"><span class="label" id="dateLabel">Date de création</span><strong id="date">—</strong></div>
<div class="item"><span class="label" id="reasonLabel">Motif du virement</span><strong id="reason">—</strong></div>
<div class="item"><span class="label" id="conditionLabel">Conditions du virement</span><strong id="condition">—</strong></div>
</div>
</section>
</main>

<script>
(async()=>{
const token=location.pathname.split('/').pop();
const $=id=>document.getElementById(id);

const labels={
fr:{
title:'Suivi du virement',tag:'SUIVI DU VIREMENT',reference:'Référence :',
loading:'Chargement…',paused:'Progression mise en pause par l’administrateur.',
waiting:'Progression en pause à 85 %, en attente de l’administrateur.',
progress:'Évolution du suivi du virement en cours.',
missing:'Lien de suivi introuvable.',verify:'Vérifiez le lien reçu.',
details:'Détails du virement',sender:'Expéditeur',beneficiary:'Bénéficiaire',
bank:'Banque bénéficiaire',country:'Pays du bénéficiaire',amount:'Montant',
date:'Date de création',reason:'Motif du virement',condition:'Conditions du virement',
unknown:'Non renseigné'
},
en:{
title:'Transfer tracking',tag:'TRANSFER TRACKING',reference:'Reference:',
loading:'Loading…',paused:'Progress paused by the administrator.',
waiting:'Progress paused at 85%, awaiting administrator release.',
progress:'Transfer tracking is in progress.',
missing:'Tracking link not found.',verify:'Please check the link you received.',
details:'Transfer details',sender:'Sender',beneficiary:'Beneficiary',
bank:'Beneficiary bank',country:'Beneficiary country',amount:'Amount',
date:'Creation date',reason:'Transfer reason',condition:'Transfer conditions',
unknown:'Not provided'
},
ar:{
title:'متابعة التحويل',tag:'متابعة التحويل',reference:'المرجع:',
loading:'جارٍ التحميل…',paused:'تم إيقاف التقدم مؤقتًا من قبل المسؤول.',
waiting:'التقدم متوقف عند 85٪ بانتظار موافقة المسؤول.',
progress:'متابعة تطور التحويل جارية.',
missing:'رابط المتابعة غير موجود.',verify:'يرجى التحقق من الرابط الذي تلقيته.',
details:'تفاصيل التحويل',sender:'المرسل',beneficiary:'المستفيد',
bank:'بنك المستفيد',country:'بلد المستفيد',amount:'المبلغ',
date:'تاريخ الإنشاء',reason:'سبب التحويل',condition:'شروط التحويل',
unknown:'غير محدد'
}
};

let t=labels.fr;

function normalizeLanguage(value){
const v=String(value||'fr').trim().toLowerCase();
if(v==='ar'||v.startsWith('arab')||v.includes('العربية')||v.includes('عربي'))return 'ar';
if(v==='en'||v.startsWith('english')||v.includes('anglais'))return 'en';
return 'fr';
}

function setLanguage(value){
const lang=normalizeLanguage(value);
t=labels[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.title=t.title;

$('tag').textContent=t.tag;
$('heading').textContent=t.title;
$('referenceLabel').textContent=t.reference;
$('detailsTitle').textContent=t.details;
$('senderLabel').textContent=t.sender;
$('beneficiaryLabel').textContent=t.beneficiary;
$('bankLabel').textContent=t.bank;
$('countryLabel').textContent=t.country;
$('amountLabel').textContent=t.amount;
$('dateLabel').textContent=t.date;
$('reasonLabel').textContent=t.reason;
$('conditionLabel').textContent=t.condition;
}

function localizeStatus(status,language){
const lang=normalizeLanguage(language);
const raw=String(status||'').trim();
const key=raw.toLowerCase().replace(/[’']/g,'').replace(/\s+/g,' ');

const inProgress=[
'virement en court','virement en cours','en cours de traitement',
'transfer in progress','processing transfer',
'التحويل قيد المعالجة','متابعة تطور التحويل جارية'
].includes(key);

if(inProgress)return lang==='ar'?'التحويل قيد المعالجة':lang==='en'?'Transfer in progress':'Virement en cours';

const paused=[
'progression mise en pause par ladministrateur',
'progress paused by the administrator',
'تم إيقاف التقدم مؤقتًا من قبل المسؤول'
].includes(key);

if(paused)return lang==='ar'?'تم إيقاف التقدم مؤقتًا من قبل المسؤول':lang==='en'?'Progress paused by the administrator':'Progression mise en pause par l’administrateur.';

const cancelled=['virement annule','virement annulé','transfer cancelled','transfer canceled','تم إلغاء التحويل'].includes(key);
if(cancelled)return lang==='ar'?'تم إلغاء التحويل':lang==='en'?'Transfer cancelled':'Virement annulé';

const completed=['virement termine','virement terminé','virement effectué','transfer completed','completed','تم التحويل'].includes(key);
if(completed)return lang==='ar'?'اكتمل التحويل':lang==='en'?'Transfer completed':'Virement terminé';

return raw||'—';
}

function displayValue(id,value){
$(id).textContent=String(value??'').trim()||t.unknown;
}

function formatAmount(cents,currency,lang){
const value=Number(cents);
if(!Number.isFinite(value))return '—';
const formatted=new Intl.NumberFormat(lang==='ar'?'ar':lang==='en'?'en':'fr',{
minimumFractionDigits:2,maximumFractionDigits:2
}).format(value/100);
return currency?formatted+' '+currency:formatted;
}

function formatDate(value,lang){
if(!value)return t.unknown;
const date=new Date(value);
if(Number.isNaN(date.getTime()))return String(value);
return new Intl.DateTimeFormat(lang==='ar'?'ar':lang==='en'?'en':'fr',{
dateStyle:'long',timeStyle:'short'
}).format(date);
}

async function refresh(){
try{
const r=await fetch('/api/transfer-tracking/'+encodeURIComponent(token),{cache:'no-store'});
const d=await r.json();
if(!r.ok)throw Error();

const lang=normalizeLanguage(d.language);
setLanguage(lang);

$('ref').textContent=d.reference||'—';
$('percent').textContent=d.progress+'%';
$('fill').style.width=Math.max(0,Math.min(100,Number(d.progress)||0))+'%';
$('status').textContent=localizeStatus(d.status,lang);
$('message').textContent=d.paused?t.paused:d.progress>=85&&!d.released85?t.waiting:t.progress;

const x=d.details||{};
displayValue('sender',x.senderName);
displayValue('beneficiary',x.beneficiaryName);
displayValue('bank',x.beneficiaryBank);
displayValue('country',x.beneficiaryCountry);
$('amount').textContent=formatAmount(x.amountCents,x.currency,lang);
displayValue('date',formatDate(x.createdAt,lang));
displayValue('reason',x.reason);
displayValue('condition',x.conditionText);

}catch(e){
$('ref').textContent='—';
$('status').textContent=t.missing;
$('message').textContent=t.verify;
}
}

await refresh();
setInterval(refresh,60000);
})();
</script>
</body>
</html>
