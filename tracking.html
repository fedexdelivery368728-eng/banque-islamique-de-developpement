<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi du virement — démonstration</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#19332d;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:28px}h1{color:#073d34}.tag{display:inline-block;padding:6px 10px;border-radius:8px;background:#fff1d6;color:#704b00;font-size:12px;font-weight:bold}.muted{color:#64746e}.bar{height:18px;background:#e6efeb;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#087f68;transition:width .3s}.percent{font-size:42px;font-weight:700;color:#073d34}.notice{margin-top:22px;padding:14px;border-radius:10px;background:#f0f7f4}</style></head>
<body><main class="wrap"><section class="card"><span class="tag" id="tag">SIMULATION DE DÉMONSTRATION</span><h1 id="heading">Suivi du virement</h1><p class="muted"><span id="referenceLabel">Référence :</span> <strong id="ref">Chargement…</strong></p><div class="percent" id="percent">—%</div><div class="bar"><div class="fill" id="fill"></div></div><strong id="status">Chargement…</strong><div class="notice" id="message">Évolution du virement en cours — simulation de démonstration.</div><p class="muted" id="disclaimer">La progression est simulée et ne prouve pas l’exécution ou le déplacement réel de fonds.</p></section></main>
<script>
(async()=>{
const token=location.pathname.split('/').pop(),$=id=>document.getElementById(id);
const labels={
fr:{title:'Suivi du virement',tag:'SIMULATION DE DÉMONSTRATION',reference:'Référence :',loading:'Chargement…',paused:'Progression mise en pause par l’administrateur.',waiting:'Progression en pause à 85 %, en attente de l’administrateur.',progress:'Évolution du virement en cours — simulation de démonstration.',disclaimer:'La progression est simulée et ne prouve pas l’exécution ou le déplacement réel de fonds.',missing:'Lien de suivi introuvable.',verify:'Vérifiez le lien reçu.'},
en:{title:'Transfer tracking',tag:'DEMONSTRATION SIMULATION',reference:'Reference:',loading:'Loading…',paused:'Progress paused by the administrator.',waiting:'Progress paused at 85%, awaiting administrator release.',progress:'Transfer progress is ongoing — demonstration simulation.',disclaimer:'Progress is simulated and does not prove that funds have moved or a transfer has been executed.',missing:'Tracking link not found.',verify:'Please check the link you received.'},
ar:{title:'متابعة التحويل',tag:'محاكاة توضيحية',reference:'المرجع:',loading:'جارٍ التحميل…',paused:'تم إيقاف التقدم مؤقتًا من قبل المسؤول.',waiting:'التقدم متوقف عند 85٪ بانتظار موافقة المسؤول.',progress:'تطور متابعة التحويل جارٍ — محاكاة توضيحية.',disclaimer:'التقدم محاكاة ولا يثبت تنفيذ التحويل أو انتقال الأموال فعليًا.',missing:'رابط المتابعة غير موجود.',verify:'يرجى التحقق من الرابط الذي تلقيته.'}
};
let t=labels.fr;
function setLanguage(lang){t=labels[lang]||labels.fr;document.documentElement.lang=labels[lang]?lang:'fr';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=t.title+' — démonstration';$('tag').textContent=t.tag;$('heading').textContent=t.title;$('referenceLabel').textContent=t.reference;$('status').textContent=t.loading;$('ref').textContent=t.loading;$('message').textContent=t.progress;$('disclaimer').textContent=t.disclaimer;}
async function refresh(){try{const r=await fetch('/api/transfer-tracking/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();setLanguage(d.language);$('ref').textContent=d.reference;$('percent').textContent=d.progress+'%';$('fill').style.width=d.progress+'%';$('status').textContent=d.status;$('message').textContent=d.paused?t.paused:d.progress>=85&&!d.released85?t.waiting:t.progress}catch(e){$('ref').textContent='—';$('status').textContent=t.missing;$('message').textContent=t.verify}}
await refresh();setInterval(refresh,60000);
})();
</script></body></html>
