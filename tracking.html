<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi du virement — démonstration</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#19332d;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:28px}h1{color:#073d34}.tag{display:inline-block;padding:6px 10px;border-radius:8px;background:#fff1d6;color:#704b00;font-size:12px;font-weight:bold}.muted{color:#64746e}.bar{height:18px;background:#e6efeb;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#087f68;transition:width .3s}.percent{font-size:42px;font-weight:700;color:#073d34}.notice{margin-top:22px;padding:14px;border-radius:10px;background:#f0f7f4}</style></head><body><main class="wrap"><section class="card"><span class="tag">SIMULATION DE DÉMONSTRATION</span><h1>Suivi du virement</h1><p class="muted">Référence : <strong id="ref">Chargement…</strong></p><div class="percent" id="percent">—%</div><div class="bar"><div class="fill" id="fill"></div></div><strong id="status">Chargement…</strong><div class="notice" id="message">Évolution du virement en cours — simulation de démonstration.</div><p class="muted">La progression est simulée et ne prouve pas l’exécution ou le déplacement réel de fonds.</p></section></main><script>(async()=>{const token=location.pathname.split('/').pop(),$=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('/api/transfer-tracking/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();$('ref').textContent=d.reference;$('percent').textContent=d.progress+'%';$('fill').style.width=d.progress+'%';$('status').textContent=d.status;$('message').textContent=d.paused?'Progression mise en pause par l’administrateur.':d.progress>=85&&!d.released85?'Progression en pause à 85 %, en attente de l’administrateur.':'Évolution du virement en cours — simulation de démonstration.'}catch(e){$('ref').textContent='—';$('status').textContent='Lien de suivi introuvable.';$('message').textContent='Vérifiez le lien reçu.'}}await refresh();setInterval(refresh,60000)})();</script></body></html>
