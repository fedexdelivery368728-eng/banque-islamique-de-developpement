<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi du virement</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#19332d;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:28px}h1{color:#073d34}.tag{display:inline-block;padding:6px 10px;border-radius:8px;background:#fff1d6;color:#704b00;font-size:12px;font-weight:bold}.muted{color:#64746e}.bar{height:18px;background:#e6efeb;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#087f68;transition:width .3s}.percent{font-size:42px;font-weight:700;color:#073d34}.notice{margin-top:22px;padding:14px;border-radius:10px;background:#f0f7f4}</style></head>
<body><main class="wrap"><section class="card"><span class="tag" id="tag">SUIVI INDICATIF</span><h1 id="heading">Suivi du virement</h1><p class="muted"><span id="referenceLabel">Référence :</span> <strong id="ref">Chargement…</strong></p><div class="percent" id="percent">—%</div><div class="bar"><div class="fill" id="fill"></div></div><strong id="status">Chargement…</strong><div class="notice" id="message">Évolution du virement en cours.</div></section></main>
<script>
(async()=>{
const token=location.pathname.split('/').pop(),$=id=>document.getElementById(id);
const labels={
fr:{title:'Suivi du virement',tag:'SUIVI INDICATIF',reference:'Référence :',loading:'Chargement…',paused:'Progression mise en pause par l’administrateur.',waiting:'Progression en pause à 85 %, en attente de l’administrateur.',progress:'Évolution du suivi du virement en cours.',missing:'Lien de suivi introuvable.',verify:'Vérifiez le lien reçu.'},
en:{title:'Transfer tracking',tag:'INDICATIVE TRACKING',reference:'Reference:',loading:'Loading…',paused:'Progress paused by the administrator.',waiting:'Progress paused at 85%, awaiting administrator release.',progress:'Transfer tracking is in progress.',missing:'Tracking link not found.',verify:'Please check the link you received.'},
ar:{title:'متابعة التحويل',tag:'متابعة إرشادية',reference:'المرجع:',loading:'جارٍ التحميل…',paused:'تم إيقاف التقدم مؤقتًا من قبل المسؤول.',waiting:'التقدم متوقف عند 85٪ بانتظار موافقة المسؤول.',progress:'متابعة تطور التحويل جارية.',missing:'رابط المتابعة غير موجود.',verify:'يرجى التحقق من الرابط الذي تلقيته.'}
};
let t=labels.fr;
function normalizeLanguage(value){const v=String(value||'fr').trim().toLowerCase();if(v==='ar'||v.startsWith('arab')||v.includes('العربية')||v.includes('عربي'))return 'ar';if(v==='en'||v.startsWith('english')||v.includes('anglais'))return 'en';return 'fr';}
function setLanguage(value){const lang=normalizeLanguage(value);t=labels[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=t.title;$('tag').textContent=t.tag;$('heading').textContent=t.title;$('referenceLabel').textContent=t.reference;$('status').textContent=t.loading;$('ref').textContent=t.loading;$('message').textContent=t.progress;}
function localizeStatus(status,language){
const lang=normalizeLanguage(language);
const raw=String(status||'').trim();
const key=raw.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[’']/g,'').replace(/\\s+/g,' ');
const inProgress=['virement en court','virement en cours','en cours de traitement','transfer in progress','processing transfer','التحويل قيد المعالجة','متابعة تطور التحويل جارية'].includes(key);
if(inProgress)return lang==='ar'?'التحويل قيد المعالجة':lang==='en'?'Transfer in progress':'Virement en cours';
const paused=['progression mise en pause par ladministrateur','progress paused by the administrator','تم إيقاف التقدم مؤقتًا من قبل المسؤول'].includes(key);
if(paused)return lang==='ar'?'تم إيقاف التقدم مؤقتًا من قبل المسؤول':lang==='en'?'Progress paused by the administrator':'Progression mise en pause par l’administrateur.';
const cancelled=['virement annule','transfer cancelled','transfer canceled','تم إلغاء التحويل'].includes(key);
if(cancelled)return lang==='ar'?'تم إلغاء التحويل':lang==='en'?'Transfer cancelled':'Virement annulé';
const completed=['virement termine','virement effectué','transfer completed','completed','تم التحويل'].includes(key);
if(completed)return lang==='ar'?'اكتمل التحويل':lang==='en'?'Transfer completed':'Virement terminé';
return raw;
}
async function refresh(){try{const r=await fetch('/api/transfer-tracking/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();const lang=normalizeLanguage(d.language);setLanguage(lang);$('ref').textContent=d.reference;$('percent').textContent=d.progress+'%';$('fill').style.width=d.progress+'%';$('status').textContent=localizeStatus(d.status,lang);$('message').textContent=d.paused?t.paused:d.progress>=85&&!d.released85?t.waiting:t.progress}catch(e){$('ref').textContent='—';$('status').textContent=t.missing;$('message').textContent=t.verify}}
await refresh();setInterval(refresh,60000);
})();
</script></body></html>
