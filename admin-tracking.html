<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — suivi des virements</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f7f5;color:#173b32}main{max-width:1200px;margin:30px auto;padding:16px}.card{background:white;border:1px solid #dce8e3;border-radius:14px;padding:18px;margin:14px 0;overflow:auto}button{border:0;border-radius:7px;padding:9px 12px;background:#087f68;color:white;cursor:pointer;margin:3px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2ebe7;vertical-align:top}.muted{color:#687871;font-size:13px}</style></head><body><main><h1>Suivi des virements</h1><p class="muted">Démonstration : la progression est simulée et ne prouve pas une exécution bancaire.</p><p><a href="/admin">← Retour à l’administration</a></p><section class="card"><p id="notice">Chargement…</p><table><thead><tr><th>Référence</th><th>Type</th><th>Client</th><th>Progression</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const rows=await api('/api/admin/transfer-tracking');document.getElementById('notice').textContent=rows.length+' suivi(s)';document.getElementById('rows').innerHTML=rows.map(x=>'<tr><td>'+esc(x.reference||x.transfer_id)+'<br><small>'+esc(x.token)+'</small><br><a href="/suivi-virement/'+encodeURIComponent(x.token)+'" target="_blank">Ouvrir la page client</a></td><td>'+esc(x.transfer_type)+'</td><td>'+esc(x.recipient_name)+'<br>'+esc(x.recipient_email)+'</td><td>'+x.progress+'%</td><td>'+esc(x.status)+(x.paused?' — en pause':'')+'</td><td><button onclick="act('+x.id+',\''+(x.paused?'resume':'pause')+'\')">'+(x.paused?'Reprendre':'Mettre en pause')+'</button><button onclick="act('+x.id+',\'release85\')">Autoriser après 85 %</button><button onclick="changeStatus('+x.id+')">Changer statut / notifier</button></td></tr>').join('')||'<tr><td colspan="6">Aucun suivi.</td></tr>'}catch(e){document.getElementById('notice').textContent='Connexion admin requise ou erreur : '+e.message}}async function act(id,action){try{await api('/api/admin/transfer-tracking/'+id,{method:'PATCH',body:JSON.stringify({action})});await load()}catch(e){alert(e.message)}}async function changeStatus(id){const status=prompt('Nouveau statut à notifier :');if(!status)return;try{await api('/api/admin/transfer-tracking/'+id,{method:'PATCH',body:JSON.stringify({action:'status',status})});await load()}catch(e){alert(e.message)}}load();setInterval(load,60000)</script></body></html>
