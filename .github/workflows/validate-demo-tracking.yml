name: Validate demo tracking changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/demo-transfer-tracking-notifications]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check server.js
      - name: Check inline JavaScript in tracking pages
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          files = ["admin.html", "admin-tracking.html", "tracking.html"]
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.skip = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.skip = "src" in attrs or attrs.get("type", "").lower() in ("application/json", "application/ld+json")
                      self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.skip:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.skip and "".join(self.current).strip():
                          self.parts.append("".join(self.current))
                      self.in_script = False
                      self.skip = False

          out = Path("/tmp/inline-js")
          out.mkdir(exist_ok=True)
          count = 0
          for filename in files:
              parser = Scripts()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              for index, script in enumerate(parser.parts, 1):
                  target = out / f"{Path(filename).stem}-{index}.js"
                  target.write_text(script, encoding="utf-8")
                  print(f"Checking {filename} inline script #{index}")
                  count += 1
          if count == 0:
              raise SystemExit("No inline JavaScript found")
          print(f"Extracted {count} inline script(s)")
          PY
          for file in /tmp/inline-js/*.js; do
            node --check "$file"
          done
