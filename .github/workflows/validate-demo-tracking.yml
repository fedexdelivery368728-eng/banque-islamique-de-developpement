name: Validate demo tracking changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/demo-transfer-tracking-notifications]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check server.js
