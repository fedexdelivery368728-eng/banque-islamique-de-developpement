<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banque Islamique de Développement</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f3f7f5;
      color:#073d34;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .card{
      width:min(520px,90%);
      background:white;
      padding:45px 30px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 10px 35px rgba(0,0,0,.08);
    }

    img{
      max-width:180px;
      max-height:100px;
      object-fit:contain;
      margin-bottom:20px;
    }

    h1{
      margin:10px 0;
      font-size:28px;
    }

    p{
      color:#555;
      line-height:1.6;
    }

    .button{
      display:inline-block;
      margin-top:20px;
      padding:14px 28px;
      background:#087f68;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-weight:bold;
    }

    .button:hover{
      background:#066b58;
    }
  </style>
</head>

<body>
  <div class="card">

    <img src="/IMG_4145.jpeg" alt="Banque Islamique de Développement">

    <h1>Banque Islamique de Développement</h1>

    <p>
      Bienvenue sur votre espace bancaire.
      Accédez à vos services bancaires en ligne de manière simple et sécurisée.
    </p>

    <a class="button" href="/client">
      Accéder à mon compte
    </a>

  </div>
</body>
</html>
